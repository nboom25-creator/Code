<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WoW Mini-MMORPG — Combat Sandbox</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>

      <!-- Top-center unit frames (player + target) -->
      <div id="unit-frames"></div>

      <!-- Center cast bar -->
      <div id="cast-bar-container"></div>

      <!-- Class selector -->
      <div id="class-bar"></div>

      <!-- Bottom action bar -->
      <div id="action-bar"></div>

      <!-- Scrolling combat log -->
      <div id="combat-log"></div>

      <!-- Loot windows anchored over corpses -->
      <div id="loot-root"></div>

      <!-- Overlays: talent tree (N), character & bags (B), item tooltip -->
      <div id="talent-root"></div>
      <div id="character-root"></div>
      <div id="tooltip-root"></div>

      <!-- Developer slash-command console -->
      <div id="dev-console"></div>

      <!-- Login / character-select screen (covers everything until logged in) -->
      <div id="login-root"></div>

      <div id="hint">
        WASD / Arrows: move &nbsp;•&nbsp; Tab / Click: target &nbsp;•&nbsp;
        1–4: Abilities &nbsp;•&nbsp; R: Stance &nbsp;•&nbsp; N: Talents &nbsp;•&nbsp;
        B: Bags &nbsp;•&nbsp; G: Aggro radii &nbsp;•&nbsp; Z/X/C: Warrior / Rogue / Mage
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
