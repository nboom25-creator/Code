# Trading bot configuration.
# Secrets (API keys) belong in .env, NOT here.

# "paper" (default, safe) or "live" (real money — requires extra confirmation).
mode: paper

# Watchlist: large, liquid names + ETFs (easy to enter/exit).
symbols:
  - SPY
  - QQQ
  - AAPL
  - MSFT

# The autonomous agent's hard per-trade rules (operator-set).
agent_risk:
  max_position_pct: 0.08          # at most 8% of the account in one trade
  daily_drawdown_limit_pct: 0.03  # halt for the day after a 3% loss
  stop_loss_pct: 0.05             # 5% protective stop on each position
  take_profit_pct: 0.10           # 10% take-profit
  max_adv_participation_pct: 0.01 # never more than 1% of a stock's daily volume
  reference_atr_pct: 0.03         # volatility baseline for conviction sizing

# Extra filters on new buys (0 / empty turns a rule off).
rules:
  min_price: 5.0            # never buy a stock under $5 (skip penny stocks)
  min_confidence: 0.60      # only act when the agent is at least 60% confident
  max_new_buys_per_run: 3   # open at most 3 new positions per run

# Also hunt for small/micro-cap opportunities each run.
discovery:
  enabled: true
  sectors:
    - Technology
    - Healthcare
    - Financial Services
    - Energy
  market_cap_max: 2000000000      # under $2B = small/micro-cap
  min_volume: 100000              # liquidity floor
  max_candidates: 5               # top N per sector

# Bar timeframe for signals: "1Min", "5Min", "15Min", "1Hour", "1Day".
timeframe: 1Day

# Benchmark for the market-regime filter (scales new-entry exposure).
benchmark: SPY

# How often the live loop wakes up, in seconds.
poll_interval_seconds: 60

strategy:
  # "sma_crossover" or "rsi_reversion"
  name: sma_crossover
  params:
    # SMA crossover
    fast_period: 20
    slow_period: 50
    # RSI mean-reversion (used when name == rsi_reversion)
    rsi_period: 14
    oversold: 30
    overbought: 70

risk:
  # Max fraction of total equity allowed in a single position.
  max_position_pct: 0.20
  # Fraction of equity risked per trade (used to size positions vs. stop).
  risk_per_trade_pct: 0.01
  # Stop-loss distance as a fraction of entry price (drives position sizing
  # and exits). Applied as a protective stop on every entry.
  stop_loss_pct: 0.05
  # Take-profit distance as a fraction of entry price. Set to 0 to disable.
  take_profit_pct: 0.10
  # Maximum number of concurrent open positions.
  max_open_positions: 5
  # Halt all new entries once daily loss exceeds this fraction of equity.
  daily_loss_limit_pct: 0.03

# Portfolio-level (account-wide) caps for the autonomous agent.
portfolio:
  max_invested_pct: 0.90  # keep at least 10% cash
  max_sector_pct: 0.30    # at most 30% of equity in any one sector
  max_positions: 10       # hold at most 10 names at once

# Order execution + account rules for the autonomous agent.
execution:
  order_type: limit        # "limit" (marketable, price-protected) or "market"
  auto_execute_confidence: 0.75  # auto-place BUYs at >=75% confidence; below that,
                                 # hold for your approval. Exits always auto-execute.
  limit_slippage_pct: 0.003  # limit may reach 0.3% through the current price
  est_slippage_pct: 0.0005   # assumed slippage for dry-run fill estimates
  commission: 0.0
  enforce_pdt: true          # block the 4th day trade on a sub-$25k account
  pdt_equity_threshold: 25000
  pdt_max_day_trades: 3
  avoid_wash_sales: true     # don't rebuy a name sold at a loss within...
  wash_sale_days: 30         # ...this many days

backtest:
  starting_cash: 100000
  # Per-trade commission in dollars (Alpaca equities are commission-free; this
  # lets you stress-test with costs).
  commission: 0.0
  # Slippage as a fraction of price applied against you on each fill.
  slippage_pct: 0.0005
