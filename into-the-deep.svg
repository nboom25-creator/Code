<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="18in" height="24in"
     viewBox="0 0 1296 1728"
     preserveAspectRatio="xMidYMid meet"
     font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">

  <!-- ============================================================= -->
  <!--  INTO THE DEEP  —  Ocean depth-zone infographic poster        -->
  <!--  18 x 24 in  (1296 x 1728 px @ 72 dpi)                         -->
  <!-- ============================================================= -->

  <defs>
    <!-- Full-height water gradient: bright surface to abyssal black -->
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.00"  stop-color="#7FD3F2"/>
      <stop offset="0.10"  stop-color="#41ADE0"/>
      <stop offset="0.21"  stop-color="#1E80C2"/>
      <stop offset="0.39"  stop-color="#0E4E86"/>
      <stop offset="0.60"  stop-color="#082F55"/>
      <stop offset="0.80"  stop-color="#041829"/>
      <stop offset="1.00"  stop-color="#010407"/>
    </linearGradient>

    <!-- Soft light shafts near the surface -->
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1"   stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow for the anglerfish lure -->
    <radialGradient id="lure" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#EAFBA0" stop-opacity="1"/>
      <stop offset="0.4" stop-color="#C9F25A" stop-opacity="0.9"/>
      <stop offset="1"   stop-color="#C9F25A" stop-opacity="0"/>
    </radialGradient>

    <!-- Generic bioluminescent dot glow -->
    <radialGradient id="bio" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9FE8FF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#9FE8FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ===================== WATER BACKGROUND ====================== -->
  <rect x="0" y="0" width="1296" height="1728" fill="url(#water)"/>

  <!-- Light shafts -->
  <g opacity="0.6">
    <polygon points="180,0 250,0 360,520 300,520" fill="url(#ray)"/>
    <polygon points="520,0 560,0 600,640 540,640" fill="url(#ray)"/>
    <polygon points="860,0 930,0 880,560 820,560" fill="url(#ray)"/>
    <polygon points="1080,0 1120,0 1010,500 970,500" fill="url(#ray)"/>
  </g>

  <!-- Drifting bubbles / marine snow -->
  <g fill="#FFFFFF">
    <circle cx="120"  cy="420"  r="3" opacity="0.5"/>
    <circle cx="160"  cy="300"  r="2" opacity="0.4"/>
    <circle cx="1180" cy="360"  r="3" opacity="0.45"/>
    <circle cx="1140" cy="240"  r="2" opacity="0.4"/>
    <circle cx="640"  cy="200"  r="2.5" opacity="0.4"/>
    <circle cx="980"  cy="760"  r="2" opacity="0.25"/>
    <circle cx="300"  cy="820"  r="2" opacity="0.22"/>
    <circle cx="700"  cy="980"  r="2" opacity="0.18"/>
    <circle cx="420"  cy="1120" r="2" opacity="0.15"/>
    <circle cx="900"  cy="1240" r="2" opacity="0.13"/>
    <circle cx="560"  cy="1380" r="2" opacity="0.12"/>
    <circle cx="1000" cy="1500" r="2" opacity="0.10"/>
    <circle cx="260"  cy="1560" r="2" opacity="0.10"/>
  </g>

  <!-- ========================= TITLE ============================= -->
  <g text-anchor="middle">
    <text x="648" y="138" font-size="104" font-weight="800"
          letter-spacing="6" fill="#FFFFFF">INTO THE DEEP</text>
    <text x="648" y="190" font-size="30" font-weight="400"
          letter-spacing="8" fill="#EAF6FF" opacity="0.9">
      A JOURNEY THROUGH THE OCEAN&#8217;S FIVE ZONES</text>
    <line x1="468" y1="214" x2="828" y2="214" stroke="#FFFFFF"
          stroke-width="2" opacity="0.6"/>
  </g>

  <!-- ===================== ZONE DIVIDERS ========================= -->
  <!-- Boundary y-positions: 360 / 700 / 1060 / 1390 -->
  <g stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1.5"
     stroke-dasharray="10 9">
    <line x1="80" y1="360"  x2="1216" y2="360"/>
    <line x1="80" y1="700"  x2="1216" y2="700"/>
    <line x1="80" y1="1060" x2="1216" y2="1060"/>
    <line x1="80" y1="1390" x2="1216" y2="1390"/>
  </g>

  <!-- ===================== DEPTH SCALE (right) =================== -->
  <g font-size="22" fill="#EAF6FF" text-anchor="end" font-weight="600">
    <text x="1216" y="356">200 m</text>
    <text x="1216" y="696">1,000 m</text>
    <text x="1216" y="1056">4,000 m</text>
    <text x="1216" y="1386">6,000 m</text>
    <text x="1216" y="1424">11,000 m</text>
  </g>

  <!-- ======================================================= -->
  <!--  ZONE 1 — SUNLIGHT / EPIPELAGIC  (y 220–360)            -->
  <!-- ======================================================= -->
  <g>
    <text x="80" y="290" font-size="48" font-weight="800"
          fill="#FFFFFF">1 · SUNLIGHT ZONE</text>
    <text x="80" y="322" font-size="24" font-weight="600"
          fill="#EAF6FF" opacity="0.85">Epipelagic &#160;|&#160; 0 – 200 m</text>
    <text x="80" y="354" font-size="23" fill="#EAF6FF" opacity="0.92">
      Enough light for photosynthesis. Home to ~90% of marine life;
      its phytoplankton make roughly half of Earth&#8217;s oxygen.</text>

    <!-- Fish + sea turtle silhouettes -->
    <g fill="#0B3A5E" opacity="0.85">
      <!-- turtle -->
      <ellipse cx="980" cy="300" rx="46" ry="30"/>
      <path d="M1024 300 q26 -6 40 6 q-18 8 -40 2 z"/>
      <path d="M948 282 q-22 -16 -34 -10 q6 16 30 18 z"/>
      <path d="M948 318 q-22 16 -34 10 q6 -16 30 -18 z"/>
      <!-- small fish -->
      <path d="M1120 250 q24 -16 50 0 q-24 16 -50 0 z M1120 250 l-14 -10 l0 20 z"/>
      <path d="M860 250 q18 -12 38 0 q-18 12 -38 0 z M860 250 l-11 -8 l0 16 z"/>
    </g>
  </g>

  <!-- ======================================================= -->
  <!--  ZONE 2 — TWILIGHT / MESOPELAGIC  (y 360–700)           -->
  <!-- ======================================================= -->
  <g>
    <text x="80" y="430" font-size="48" font-weight="800"
          fill="#FFFFFF">2 · TWILIGHT ZONE</text>
    <text x="80" y="462" font-size="24" font-weight="600"
          fill="#CFE8FF" opacity="0.85">Mesopelagic &#160;|&#160; 200 – 1,000 m</text>
    <text x="80" y="494" font-size="23" fill="#CFE8FF" opacity="0.9">
      Only a faint blue glow remains. Many animals are bioluminescent</text>
    <text x="80" y="522" font-size="23" fill="#CFE8FF" opacity="0.9">
      and rise toward the surface each night to feed.</text>

    <!-- Jellyfish -->
    <g fill="#7FB8E0" opacity="0.8">
      <path d="M1040 560 q-46 -60 0 -100 q46 40 0 100 z"/>
      <g stroke="#7FB8E0" stroke-width="3" fill="none" opacity="0.7">
        <path d="M1018 558 q-6 40 4 80"/>
        <path d="M1032 560 q0 44 -2 84"/>
        <path d="M1048 560 q6 40 -2 80"/>
        <path d="M1062 558 q8 38 0 78"/>
      </g>
    </g>
    <!-- Lanternfish with photophores -->
    <g>
      <path d="M880 640 q40 -22 86 0 q-40 22 -86 0 z M880 640 l-20 -14 l0 28 z"
            fill="#163E5E" opacity="0.9"/>
      <circle cx="900" cy="648" r="4" fill="url(#bio)"/>
      <circle cx="916" cy="650" r="4" fill="url(#bio)"/>
      <circle cx="932" cy="650" r="4" fill="url(#bio)"/>
    </g>
  </g>

  <!-- ======================================================= -->
  <!--  ZONE 3 — MIDNIGHT / BATHYPELAGIC  (y 700–1060)         -->
  <!-- ======================================================= -->
  <g>
    <text x="80" y="772" font-size="48" font-weight="800"
          fill="#FFFFFF">3 · MIDNIGHT ZONE</text>
    <text x="80" y="804" font-size="24" font-weight="600"
          fill="#AFD0EE" opacity="0.8">Bathypelagic &#160;|&#160; 1,000 – 4,000 m</text>
    <text x="80" y="836" font-size="23" fill="#AFD0EE" opacity="0.85">
      No sunlight reaches here. Near-freezing water and crushing</text>
    <text x="80" y="864" font-size="23" fill="#AFD0EE" opacity="0.85">
      pressure; food drifts down as &#8220;marine snow.&#8221;</text>

    <!-- Anglerfish -->
    <g transform="translate(910 900)">
      <path d="M0 0 q60 -52 130 -34 q40 10 52 34 q-12 24 -52 34 q-70 18 -130 -34 z"
            fill="#0A2236" opacity="0.95"/>
      <!-- tail -->
      <path d="M0 0 l-30 -26 l0 52 z" fill="#0A2236" opacity="0.95"/>
      <!-- mouth / teeth -->
      <path d="M150 8 l28 6 l-26 8 z" fill="#0A2236" opacity="0.95"/>
      <g stroke="#DCEFF7" stroke-width="2">
        <line x1="150" y1="6"  x2="156" y2="14"/>
        <line x1="160" y1="6"  x2="166" y2="14"/>
        <line x1="170" y1="6"  x2="176" y2="14"/>
      </g>
      <!-- eye -->
      <circle cx="120" cy="-6" r="5" fill="#DCEFF7"/>
      <!-- lure stalk + glow -->
      <path d="M110 -34 q22 -56 -2 -88" stroke="#0A2236" stroke-width="5"
            fill="none"/>
      <circle cx="100" cy="-126" r="26" fill="url(#lure)"/>
      <circle cx="100" cy="-126" r="7"  fill="#F4FFCB"/>
    </g>
  </g>

  <!-- ======================================================= -->
  <!--  ZONE 4 — ABYSSAL / ABYSSOPELAGIC  (y 1060–1390)        -->
  <!-- ======================================================= -->
  <g>
    <text x="80" y="1132" font-size="48" font-weight="800"
          fill="#F2F8FC">4 · ABYSSAL ZONE</text>
    <text x="80" y="1164" font-size="24" font-weight="600"
          fill="#9CB8D2" opacity="0.8">Abyssopelagic &#160;|&#160; 4,000 – 6,000 m</text>
    <text x="80" y="1196" font-size="23" fill="#9CB8D2" opacity="0.82">
      Pitch black, about 4&#176;C, immense pressure. Vast flat plains</text>
    <text x="80" y="1224" font-size="23" fill="#9CB8D2" opacity="0.82">
      blanket much of the seafloor; life is sparse and slow.</text>

    <!-- Tripod fish on stilts -->
    <g stroke="#3A5772" stroke-width="4" fill="#1A3045">
      <path d="M900 1280 q44 -16 92 0 q-44 16 -92 0 z" stroke="none"/>
      <path d="M900 1280 l-22 -14 l0 28 z" stroke="none"/>
      <line x1="912" y1="1288" x2="900" y2="1340"/>
      <line x1="952" y1="1290" x2="958" y2="1342"/>
      <line x1="978" y1="1288" x2="996" y2="1340"/>
    </g>
    <!-- Sea cucumber -->
    <path d="M1060 1330 q40 -22 80 0 q-6 14 -40 14 q-34 0 -40 -14 z"
          fill="#243B50" opacity="0.85"/>
  </g>

  <!-- ======================================================= -->
  <!--  ZONE 5 — HADAL / HADOPELAGIC  (y 1390–1728)            -->
  <!-- ======================================================= -->
  <g>
    <text x="80" y="1466" font-size="48" font-weight="800"
          fill="#EAF2F8">5 · HADAL ZONE</text>
    <text x="80" y="1498" font-size="24" font-weight="600"
          fill="#8AA6C0" opacity="0.8">Hadopelagic &#160;|&#160; 6,000 – 11,000 m</text>
    <text x="80" y="1530" font-size="23" fill="#8AA6C0" opacity="0.82">
      Found only in deep ocean trenches. Pressure can exceed 1,100&#215;</text>
    <text x="80" y="1558" font-size="23" fill="#8AA6C0" opacity="0.82">
      that at the surface. The Mariana Trench plunges to ~10,935 m.</text>

    <!-- Snailfish -->
    <g fill="#2A4258" opacity="0.9">
      <path d="M900 1470 q56 -28 108 0 q-30 18 -54 18 q-32 0 -54 -18 z"/>
      <path d="M900 1470 l-26 -16 l0 30 z"/>
      <circle cx="980" cy="1466" r="4" fill="#CFE0EC"/>
    </g>
  </g>

  <!-- ====================== SEAFLOOR ============================ -->
  <path d="M0 1660 q200 -34 380 -6 q220 34 460 -8 q260 -38 456 6 l0 76 l-1296 0 z"
        fill="#020608"/>
  <path d="M0 1672 q220 -22 430 0 q240 24 470 -6 q210 -22 396 8 l0 54 l-1296 0 z"
        fill="#000000" opacity="0.85"/>

  <!-- ======================== FOOTER ============================ -->
  <g text-anchor="middle" fill="#9FB6CC">
    <text x="648" y="1706" font-size="20" letter-spacing="3"
          opacity="0.75">DEPTHS LABELLED TO SCALE OF MEASUREMENT, NOT DRAWN TO SCALE</text>
  </g>

</svg>
