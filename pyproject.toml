[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-bot"
version = "0.1.0"
description = "Autonomous rule-based trading bot for US stocks/ETFs (Alpaca)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "alpaca-py>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
trading-bot = "trading_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
