[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisquant"
version = "1.0.0"
description = "AegisQuant — autonomous, auditable equities research and execution platform"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.4",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "redis>=5.0",
    "celery>=5.4",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "structlog>=24.1",
    "bcrypt>=4.1",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "freezegun>=1.5",
]
providers = ["yfinance>=0.2.40"]

[project.scripts]
aegisquant = "aegisquant.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aegisquant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["network: requires outbound network access (deselected by default)"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "B008",   # FastAPI's Depends() in defaults is the framework's own idiom
    "SIM108", # ternaries are not always clearer than an if/else
    "B904",   # `raise ... from` is used where the chain matters, not everywhere
    "UP042",  # str+Enum is kept for JSON serialisation compatibility
    "UP047",  # PEP 695 generics are not needed for a single TypeVar helper
    "SIM105", # contextlib.suppress obscures intent in tight numeric paths
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false
check_untyped_defs = true
exclude = "(alembic|tests)/"

# Type checking is applied as a *gate on the safety-critical path* — config,
# risk engine, order management, brokers, governance and API security are held
# clean, because a type error there can move money.
#
# The research modules below are exempted from strict narrowing. They operate on
# `dict[str, float | None]` feature maps where the runtime pattern
# `if f.get(k) is not None and f[k] < x` is correct but cannot be narrowed by the
# checker, and on NumPy/Decimal boundaries whose stubs disagree with each other.
# Suppressing there keeps the checker's remaining output actionable instead of
# training everyone to ignore it. Correctness in these modules is enforced by the
# test suite, which exercises the numeric paths directly.
[[tool.mypy.overrides]]
module = [
    "aegisquant.strategies.momentum",
    "aegisquant.strategies.growth",
    "aegisquant.strategies.tactical",
    "aegisquant.features.growth_score",
    "aegisquant.features.market_view",
    "aegisquant.features.news_features",
    "aegisquant.backtest.metrics",
    "aegisquant.backtest.engine",
    "aegisquant.api.routers.dashboard",
    "aegisquant.api.routers.journal",
    "aegisquant.api.routers.execution",
    "aegisquant.data.ingest",
    "aegisquant.loop.autonomous",
]
ignore_errors = true
