name: Deploy to GitHub Pages

# Publishes the game (a fully static site) to GitHub Pages.
# One-time setup: in the repo, go to Settings → Pages → Build and
# deployment → Source: "GitHub Actions". After that, every push to the
# branch below redeploys automatically and the URL appears in this
# workflow's summary (and under Settings → Pages).

on:
  push:
    branches:
      - claude/wow-style-game-build-u792fs
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
