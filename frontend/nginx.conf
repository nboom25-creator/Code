server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_read_timeout 3600s;      # SSE job streams
        proxy_buffering off;
        client_max_body_size 200m;     # STL uploads
    }
    location /health {
        proxy_pass http://backend:8000;
    }
    location / {
        try_files $uri /index.html;
    }
}
